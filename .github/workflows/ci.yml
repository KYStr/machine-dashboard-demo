name: Test and build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit and API tests
        run: npm test
      - name: Build web and portable preview
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tooling
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Browser acceptance tests
        run: npm run test:e2e
      - name: Machine count regression tests
        if: success() || failure()
        run: python tests/count-switch.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-artifacts
          path: artifacts/
          retention-days: 7
